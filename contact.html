<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подорожі — Контакти</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="head">
        <img src="img/logo.png" class="logo" alt="логотип">
        <nav class="menu">
            <ul class="menu-links">
                <li class="menu-item"><a href="index.html" class="menu-item-link">Головна</a></li>
                <li class="menu-item"><a href="destinations.html" class="menu-item-link">Напрямки</a></li>
                <li class="menu-item"><a href="contact.html" class="menu-item-link active">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact">
        <h2 class="contact-title">Контакти</h2>

        <form class="form" action="#" method="post">
            <label class="form-label" for="name">Ім'я</label>
            <input class="form-input" type="text" id="name" name="name" required>

            <label class="form-label" for="email">Електронна пошта</label>
            <input class="form-input" type="email" id="email" name="email" required>

            <label class="form-label" for="message">Повідомлення</label>
            <textarea class="form-textarea" id="message" name="message" required></textarea>

            <button class="form-button" type="submit">Відправити</button>
        </form>
    </section>

    <footer class="footer">
        <p class="footer-info">&copy; 2026 Подорожі. Автор: Влад Одинак. Всі права захищено.</p>
    </footer>

    <script>
        document.querySelector('.form').addEventListener('submit', function (event) {
            event.preventDefault();
            const button = this.querySelector('.form-button');
            button.textContent = 'Ми відповімо вам найближчим часом!';
            button.disabled = true;
        });
    </script>
</body>
</html>
